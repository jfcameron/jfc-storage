name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.preset }} (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: linux-gcc
            runner: ubuntu-latest

          - preset: linux-clang
            runner: ubuntu-latest

          - preset: linux-gcc
            runner: ubuntu-24.04-arm

          - preset: linux-gcc-ci
            runner: ubuntu-latest

          - preset: linux-clang-ci
            runner: ubuntu-latest

          - preset: linux-clang-asan-ubsan
            runner: ubuntu-latest

          - preset: macos-clang
            runner: macos-latest

          - preset: windows-msvc
            runner: windows-latest

          - preset: windows-msvc-ci
            runner: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: install ninja
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: configure
        run: cmake --preset ${{ matrix.preset }}

      - name: build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: test
        run: ctest --preset ${{ matrix.preset }}

  android:
    name: android-arm64 (compile only)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: configure
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cmake --preset android-arm64

      - name: build
        run: cmake --build --preset android-arm64

  ios:
    name: ios (compile only)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: install ninja
        run: brew install ninja

      - name: configure
        run: cmake --preset ios

      - name: build
        run: cmake --build --preset ios

  emscripten:
    name: emscripten (wasm)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: report the toolchain
        run: emcc --version

      - name: configure
        run: emcmake cmake --preset emscripten

      - name: build
        run: cmake --build --preset emscripten

      - name: test
        run: ctest --preset emscripten

  fuzz:
    name: fuzz (libFuzzer)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: install clang and ninja
        run: sudo apt-get update && sudo apt-get install -y clang ninja-build

      - name: configure
        run: cmake --preset linux-clang-fuzz

      - name: build
        run: cmake --build --preset linux-clang-fuzz

      - name: replay the corpus
        run: ctest --preset linux-clang-fuzz

      - name: fuzz for a minute
        run: ./out/build/linux-clang-fuzz/fuzz/jfcstorage_fuzz_path_fuzz -max_total_time=60 fuzz/corpus/paths

  docs:
    name: documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: install doxygen and ninja
        run: sudo apt-get update && sudo apt-get install -y doxygen ninja-build

      - name: generate
        run: cmake --preset linux-docs

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: install clang-tidy and ninja
        run: sudo apt-get update && sudo apt-get install -y clang clang-tidy ninja-build

      - name: configure
        run: cmake --preset linux-clang

      - name: check
        run: run-clang-tidy -quiet -p out/build/linux-clang '/jfc-storage/(src|impl|test)/'
